name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: read

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#39D353&color_dots=#E5E7EB,#BAE6FD,#7DD3FC,#38BDF8,#0284C7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39D353&color_dots=#161B22,#0C4A6E,#0369A1,#0284C7,#38BDF8
      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
